name: cloud-data-ingestion

# Cloud-only ingestion scheduler. Vercel Functions do the work; GitHub Actions is only the clock.
# Hobby Vercel plan cannot run sub-daily crons, so the schedule lives here instead.
#
# Requires repo secret: SMARTFUND_CRON_SECRET  (must equal the Vercel Production env var CRON_SECRET)
# Scheduled workflows only run from the repository default branch.

on:
  schedule:
    - cron: "7 * * * *"  # Fund holdings       — every hour at :07
    - cron: "17 * * * *" # ETF price          — every hour at :17
    - cron: "27 * * * *" # Fund NAV (SITCA)   — every hour at :27
    - cron: "37 * * * *" # MoneyDJ fund NAV    — every hour at :37
    - cron: "47 * * * *" # MoneyDJ ETF hold.   — every hour at :47
    - cron: "57 * * * *" # Global ETF hold.    — every hour at :57
    # Consensus radar (大佬觀點) is intentionally NOT scheduled here. It already has its own Vercel Cron
    # (vercel.json: /api/workflows/bootstrap?workflow=consensus, daily 20 16 * * *) driving a Durable
    # Workflow (app/workflows/consensus-cycle.ts) that self-paces 8 ingest passes 3h apart and internally
    # calls consensus-ingest / -reprocess / -flips / -push each pass, plus -backfill / -aggregate /
    # -performance once per cycle — i.e. every endpoint below already runs on schedule via Vercel. Found
    # during a scheduler audit that this workflow file, before being committed here, would have doubled
    # up on all of them the moment GitHub Actions started running (each endpoint's hour/day-bucketed
    # run_key makes a second same-window call a safe no-op, not corruption — but still pointless). Kept
    # as workflow_dispatch-only options below (job=consensus-ingest etc.) for manual/fallback use, not on
    # the automatic schedule, so Vercel Workflow stays the one PRIMARY trigger for this domain.
    # Fundamentals freshness (我的分析 PE staleness fix) — Asia/Taipei = UTC+8
    - cron: "30 8 * * 1-5"  # TW BWIBBU PE refresh — 16:30 Taipei, after TWSE/TPEx 13:30 close (weekdays only)
    - cron: "0 */3 * * *"   # Global PE recompute — every 3h, bounded batch + checkpoint cycles the full NASDAQ/NYSE universe over a day
    - cron: "30 10 * * 1-5" # MOPS financial incremental — 18:30 Taipei, after-hours filing check (weekdays)
    - cron: "30 14 * * 1-5" # MOPS financial incremental (2nd pass) — 22:30 Taipei, catches late filers same day
    - cron: "0 13 * * *"    # SEC EDGAR financial incremental (discovery + bounded issuer refresh) — daily
    # FX quote (2026-09-12): Vercel Hobby rejected `0 */2 * * 1-5` outright ("Hobby accounts are
    # limited to daily cron jobs") — same sub-daily limitation as everything else in this file, same
    # fix. This IS the primary FX quote trigger; Vercel's own daily quote cron (vercel.json,
    # 0 21 * * 1-5) is kept only as a safety net if this workflow ever fails to fire. Both call the
    # same idempotent, stale-guarded route, so a same-day double-run is a safe no-op, not corruption.
    - cron: "0 */2 * * 1-5" # FX quote (390 Yahoo-direct pairs, auto-chains 162 derived-cross) — every 2h weekdays
    # Crypto: bounded rolling slices, seven days/week. Shared concurrency queues jobs.
    - cron: "2,17,32,47 * * * *" # quote: every 15m
    - cron: "9,39 * * * *"      # marketcap: every 30m, max 250 markets
    - cron: "23 */2 * * *"      # history: every 2h, existing small batches
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options: [both, etf-price, moneydj-fund, moneydj-etf, global-etf-holdings, fund-holdings, fund-nav, consensus-ingest, consensus-aggregate, consensus-performance, consensus-flips, consensus-backfill, tw-fundamentals-refresh, global-pe-recompute, mops-financial-incremental, sec-financial-incremental, fx-quote, crypto-quote, crypto-marketcap, crypto-history, all]

concurrency:
  group: cloud-data-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://smartfund-v2.vercel.app
      SECRET: ${{ secrets.SMARTFUND_CRON_SECRET }}
    steps:
      - name: Guard — secret present
        run: |
          if [ -z "${SECRET}" ]; then
            echo "::error::SMARTFUND_CRON_SECRET is not set on this repository."
            exit 1
          fi

      - name: Select job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "2,17,32,47 * * * *") echo "job=crypto-quote" >> "$GITHUB_OUTPUT" ;;
            "9,39 * * * *") echo "job=crypto-marketcap" >> "$GITHUB_OUTPUT" ;;
            "23 */2 * * *") echo "job=crypto-history" >> "$GITHUB_OUTPUT" ;;
            "7 * * * *")  echo "job=fund-holdings" >> "$GITHUB_OUTPUT" ;;
            "17 * * * *") echo "job=etf-price" >> "$GITHUB_OUTPUT" ;;
            "27 * * * *") echo "job=fund-nav" >> "$GITHUB_OUTPUT" ;;
            "37 * * * *") echo "job=moneydj-fund" >> "$GITHUB_OUTPUT" ;;
            "47 * * * *") echo "job=moneydj-etf" >> "$GITHUB_OUTPUT" ;;
            "57 * * * *") echo "job=global-etf-holdings" >> "$GITHUB_OUTPUT" ;;
            "20 1,4,7,10,13,16,19,22 * * *") echo "job=consensus-ingest" >> "$GITHUB_OUTPUT" ;;
            "30 22 * * *") echo "job=consensus-aggregate" >> "$GITHUB_OUTPUT" ;;
            "0 0 * * *") echo "job=consensus-performance" >> "$GITHUB_OUTPUT" ;;
            "40 1,4,7,10,13,16,19,22 * * *") echo "job=consensus-flips" >> "$GITHUB_OUTPUT" ;;
            "50 23 * * *") echo "job=consensus-backfill" >> "$GITHUB_OUTPUT" ;;
            "30 8 * * 1-5") echo "job=tw-fundamentals-refresh" >> "$GITHUB_OUTPUT" ;;
            "0 */3 * * *") echo "job=global-pe-recompute" >> "$GITHUB_OUTPUT" ;;
            "30 10 * * 1-5") echo "job=mops-financial-incremental" >> "$GITHUB_OUTPUT" ;;
            "30 14 * * 1-5") echo "job=mops-financial-incremental" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * *") echo "job=sec-financial-incremental" >> "$GITHUB_OUTPUT" ;;
            "0 */2 * * 1-5") echo "job=fx-quote" >> "$GITHUB_OUTPUT" ;;
            *)            echo "job=${{ github.event.inputs.job || 'all' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fund holdings batch (MoneyDJ)
        if: ${{ contains(fromJSON('["fund-holdings","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-fund-holdings?provider=ALL" | tee fund-holdings-response.json
          echo

      - name: Fund NAV batch (SITCA)
        if: ${{ contains(fromJSON('["fund-nav","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-fund-nav?provider=ALL" | tee fund-nav-response.json
          echo

      - name: ETF price batch
        if: ${{ contains(fromJSON('["etf-price","both","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          # retry only transient network / 5xx; never hammer 403/429
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-etf-price" | tee etf-price-response.json
          echo

      - name: MoneyDJ fund batch
        if: ${{ contains(fromJSON('["moneydj-fund","both","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-moneydj-fund" | tee moneydj-fund-response.json
          echo

      - name: MoneyDJ ETF holdings batch
        if: ${{ contains(fromJSON('["moneydj-etf","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-moneydj-etf" | tee moneydj-etf-response.json
          echo

      - name: Global ETF holdings batch (BlackRock / iShares)
        if: ${{ contains(fromJSON('["global-etf-holdings","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-global-etf-holdings?provider=ALL" | tee global-etf-holdings-response.json
          echo

      - name: Consensus ingest (whitelisted sources -> events)
        if: ${{ contains(fromJSON('["consensus-ingest","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-ingest" | tee consensus-ingest-response.json
          echo

      - name: Consensus aggregate (1D / 7D / 30D rollup)
        if: ${{ contains(fromJSON('["consensus-aggregate","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-aggregate" | tee consensus-aggregate-response.json
          echo

      - name: Consensus performance (1M / 3M / 6M historical accuracy)
        if: ${{ contains(fromJSON('["consensus-performance","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-performance" | tee consensus-performance-response.json
          echo

      - name: Consensus flips (viewpoint-flip detection)
        if: ${{ contains(fromJSON('["consensus-flips","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-flips" | tee consensus-flips-response.json
          echo

      - name: Consensus backfill (bounded historical walk)
        if: ${{ contains(fromJSON('["consensus-backfill","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-backfill?days=180" | tee consensus-backfill-response.json
          echo

      - name: TW fundamentals refresh (BWIBBU PE, full market batch)
        if: ${{ contains(fromJSON('["tw-fundamentals-refresh","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 60 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-tw-fundamentals-refresh" | tee tw-fundamentals-refresh-response.json
          echo

      - name: Global PE recompute (DB-side, bounded batch)
        if: ${{ contains(fromJSON('["global-pe-recompute","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 60 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-global-pe-recompute" | tee global-pe-recompute-response.json
          echo

      - name: MOPS financial incremental (TWSE/TPEx, recent quarters only)
        if: ${{ contains(fromJSON('["mops-financial-incremental","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 110 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-mops-financial-incremental" | tee mops-financial-incremental-response.json
          echo

      - name: SEC EDGAR financial incremental (discovery + bounded issuer refresh)
        if: ${{ contains(fromJSON('["sec-financial-incremental","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 110 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-sec-financial-incremental" | tee sec-financial-incremental-response.json
          echo

      - name: FX quote (390 Yahoo-direct pairs, auto-chains 162 derived-cross)
        if: ${{ contains(fromJSON('["fx-quote","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          # Observed live to take up to ~250s for a full 390-pair sweep on Vercel — max-time is
          # comfortably above that and above the route's own maxDuration (280s), so curl never hangs
          # up on a still-running function. No retry: a partial run already checkpoints cleanly and
          # a retry would just re-hit the same in-progress dedup window.
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 320 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-fx?phase=quote" | tee fx-quote-response.json
          echo

      - name: Crypto bounded slice
        # Keep legacy all/both semantics unchanged; manual Crypto runs select a phase explicitly.
        if: ${{ startsWith(steps.pick.outputs.job, 'crypto-') }}
        env:
          CRYPTO_JOB: ${{ steps.pick.outputs.job }}
          CRYPTO_INVOCATION_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          phase="${CRYPTO_JOB#crypto-}"
          case "$phase" in quote|marketcap|history) ;; *) exit 1 ;; esac
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 320 \
               -H "Authorization: Bearer ${SECRET}" \
               -H "x-crypto-invocation-id: ${CRYPTO_INVOCATION_ID}" \
               "${BASE_URL}/api/cron/yahoo-crypto?phase=${phase}" | tee "crypto-${phase}-response.json"
          # A 200 PARTIAL response must not hide provider/symbol failures in Actions.
          jq -e '.ok == true and ((.failedMarkets // []) | length == 0)' "crypto-${phase}-response.json" >/dev/null

      - name: Upload responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-responses-${{ github.run_id }}
          path: "*-response.json"
          if-no-files-found: ignore
          retention-days: 7
