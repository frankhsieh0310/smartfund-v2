               "${BASE_URL}/api/cron/yahoo-index?phase=history&market=philippines&symbols=PSEI.PS" | tee index-philippines-response.json
          echo

      - name: Index — Hong Kong market close (^HSI)
        if: ${{ contains(fromJSON('["index-hongkong","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 120 \
