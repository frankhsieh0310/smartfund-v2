               "${BASE_URL}/api/cron/yahoo-index?phase=history&market=hongkong&symbols=%5EHSI" | tee index-hongkong-response.json
          echo

      - name: Index — SE Asia market close (^JKSE, ^KLSE, ^STI)
        if: ${{ contains(fromJSON('["index-sea","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
