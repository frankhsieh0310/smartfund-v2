          echo

      - name: Index — Russia market close (RTSI.ME, source frozen since 2022 — expect NOOP)
        if: ${{ contains(fromJSON('["index-russia","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 120 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-index?phase=history&market=russia&symbols=RTSI.ME" | tee index-russia-response.json
          echo

      - name: Index — Europe market close (^GDAXI, ^FTSE, ^FCHI)
        if: ${{ contains(fromJSON('["index-europe","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 150 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-index?phase=history&market=europe&symbols=%5EGDAXI,%5EFTSE,%5EFCHI" | tee index-europe-response.json
          echo

      - name: Index — US market close (^DJI, ^GSPC, ^IXIC, ^SOX)
        if: ${{ contains(fromJSON('["index-us","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 150 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-index?phase=history&market=us&symbols=%5EDJI,%5EGSPC,%5EIXIC,%5ESOX" | tee index-us-response.json
          echo

      - name: Crypto bounded slice
        # Keep legacy all/both semantics unchanged; manual Crypto runs select a phase explicitly.
        if: ${{ startsWith(steps.pick.outputs.job, 'crypto-') }}
        env:
          CRYPTO_JOB: ${{ steps.pick.outputs.job }}
          CRYPTO_INVOCATION_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          phase="${CRYPTO_JOB#crypto-}"
          case "$phase" in quote|marketcap|history) ;; *) exit 1 ;; esac
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 320 \
               -H "Authorization: Bearer ${SECRET}" \
               -H "x-crypto-invocation-id: ${CRYPTO_INVOCATION_ID}" \
               "${BASE_URL}/api/cron/yahoo-crypto?phase=${phase}" | tee "crypto-${phase}-response.json"
          # A 200 PARTIAL response must not hide provider/symbol failures in Actions.
          jq -e '.ok == true and ((.failedMarkets // []) | length == 0)' "crypto-${phase}-response.json" >/dev/null

      - name: Upload responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-responses-${{ github.run_id }}
          path: "*-response.json"
          if-no-files-found: ignore
          retention-days: 7

  # Macro/BIS single source-level owner. A different job shape from `ingest` above (which only
  # curls already-deployed Vercel routes): this decouples the existing Macro/BIS automation from
  # the Railway `run-production-cron.ts` monolith (currently Failed, and bundles Stock/ETF/
  # Financial/Earnings/legacy work this round must not touch) by running the SAME existing,
  # unmodified scripts directly on the Actions runner instead — no parser rewrite, no schema
  # change, no new engine. Each script keeps its own DB-backed lifecycle lock
  # (production_scheduler_locks/runs/checkpoints, the identical framework Railway itself used),
  # so even if Railway is later restored, both owners can never write concurrently: the lock is a
  # single row in Postgres, not a per-machine concept.
  #
  # Reused as-is: scripts/data/daily/run-production-macro-daily.ts (FRED, ECB, IMF, OECD, World
  # Bank — configured via config/asset-provider-registry.json's MACRO.providerAdapters, one
  # process, source-state-driven, NOOPs on unchanged series, per-series failure isolation),
  # scripts/data/bis/run-shared-bis-official.ts --resume (BIS, same lifecycle lock family), and
  # scripts/data/economic-indicators/ingest-taiwan-cbc-official.ts (CBC Taiwan — previously
  # orphaned with zero scheduler; its own checksum-gated upsert already made it safe to include
  # here as a third step in the same single owner, not a new per-indicator scheduler).
  #
  # Requires repo secrets: DATABASE_URL (direct Postgres connection — new requirement, this job is
  # the first to need one since every other job here only calls Vercel routes) and, optionally,
  # FRED_API_KEY (its adapter already degrades to a graceful no-op via BLOCKED_AUTH handling if
  # absent, so this job does not fail without it — but FRED simply won't sync until it's set).
  macro-bis-daily:
    if: ${{ github.event.schedule == '10 5 * * *' || github.event.inputs.job == 'macro-bis-daily' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: macro-bis-daily
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Guard — DATABASE_URL present
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set on this repository — required for the Macro/BIS owner to run directly on the Actions runner."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx prisma generate

      - name: Macro daily (FRED, ECB, IMF, OECD, World Bank)
        continue-on-error: true
        run: node --experimental-strip-types scripts/data/daily/run-production-macro-daily.ts

      - name: BIS shared official
        continue-on-error: true
        run: node --experimental-strip-types scripts/data/bis/run-shared-bis-official.ts --resume

      - name: CBC Taiwan official
        run: node --experimental-strip-types scripts/data/economic-indicators/ingest-taiwan-cbc-official.ts

  # Release-aware trigger for the one release-family group with a reliable, verified official
  # release TIME (see the schedule comment above): US BLS/BEA/Census core releases (NFP, CPI, PPI,
  # GDP, PCE), all via the FRED adapter already used by macro-bis-daily. This is a release
  # WATCHER, not a second writer: it calls the exact same existing, unmodified
  # run-production-macro-daily.ts script (same DB-backed lifecycle lock, same source-state/NOOP
  # logic, same canonical writer) with --providers=FRED, so a still-stale source at any given
  # check is a harmless no-op, never a guessed or duplicated write. Four cron entries at this
  # single trigger time implement bounded retry (T+0/10/20/40) with zero new retry-loop code — one
  # source-level updater, still checked as a whole (not per-indicator); the existing
  # macro-bis-daily daily safety sweep above remains the final catch-all for delayed releases.
  macro-release-window-us:
    if: ${{ contains(fromJSON('["30 13 * * 1-5","40 13 * * 1-5","50 13 * * 1-5","10 14 * * 1-5"]'), github.event.schedule) || github.event.inputs.job == 'macro-release-window-us' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: macro-bis-daily
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Guard — DATABASE_URL present
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set on this repository."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx prisma generate

      - name: FRED release-window check (NFP/CPI/PPI/GDP/PCE)
        run: node --experimental-strip-types scripts/data/daily/run-production-macro-daily.ts --providers=FRED
