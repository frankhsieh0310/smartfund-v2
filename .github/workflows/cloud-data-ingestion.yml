          echo

      - name: Index — Philippines market close (PSEI.PS)
        if: ${{ contains(fromJSON('["index-philippines","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
