name: cloud-data-ingestion

# Cloud-only ingestion scheduler. Vercel Functions do the work; GitHub Actions is only the clock.
# Hobby Vercel plan cannot run sub-daily crons, so the schedule lives here instead.
#
# Requires repo secret: SMARTFUND_CRON_SECRET  (must equal the Vercel Production env var CRON_SECRET)
# Scheduled workflows only run from the repository default branch.

on:
  schedule:
    - cron: "7 * * * *"  # Fund holdings       — every hour at :07
    - cron: "17 * * * *" # ETF price          — every hour at :17
    - cron: "27 * * * *" # Fund NAV (SITCA)   — every hour at :27
    - cron: "37 * * * *" # MoneyDJ fund NAV    — every hour at :37
    - cron: "47 * * * *" # MoneyDJ ETF hold.   — every hour at :47
    - cron: "57 * * * *" # Global ETF hold.    — every hour at :57
    # Consensus radar (大佬觀點) is intentionally NOT scheduled here. It already has its own Vercel Cron
    # (vercel.json: /api/workflows/bootstrap?workflow=consensus, daily 20 16 * * *) driving a Durable
    # Workflow (app/workflows/consensus-cycle.ts) that self-paces 8 ingest passes 3h apart and internally
    # calls consensus-ingest / -reprocess / -flips / -push each pass, plus -backfill / -aggregate /
    # -performance once per cycle — i.e. every endpoint below already runs on schedule via Vercel. Found
    # during a scheduler audit that this workflow file, before being committed here, would have doubled
    # up on all of them the moment GitHub Actions started running (each endpoint's hour/day-bucketed
    # run_key makes a second same-window call a safe no-op, not corruption — but still pointless). Kept
    # as workflow_dispatch-only options below (job=consensus-ingest etc.) for manual/fallback use, not on
    # the automatic schedule, so Vercel Workflow stays the one PRIMARY trigger for this domain.
    # Fundamentals freshness (我的分析 PE staleness fix) — Asia/Taipei = UTC+8
    - cron: "30 8 * * 1-5"  # TW BWIBBU PE refresh — 16:30 Taipei, after TWSE/TPEx 13:30 close (weekdays only)
    - cron: "0 */3 * * *"   # Global PE recompute — every 3h, bounded batch + checkpoint cycles the full NASDAQ/NYSE universe over a day
    - cron: "30 10 * * 1-5" # MOPS financial incremental — 18:30 Taipei, after-hours filing check (weekdays)
    - cron: "30 14 * * 1-5" # MOPS financial incremental (2nd pass) — 22:30 Taipei, catches late filers same day
    - cron: "0 13 * * *"    # SEC EDGAR financial incremental (discovery + bounded issuer refresh) — daily
    # FX quote (2026-09-12): Vercel Hobby rejected `0 */2 * * 1-5` outright ("Hobby accounts are
    # limited to daily cron jobs") — same sub-daily limitation as everything else in this file, same
    # fix. This IS the primary FX quote trigger; Vercel's own daily quote cron (vercel.json,
    # 0 21 * * 1-5) is kept only as a safety net if this workflow ever fails to fire. Both call the
    # same idempotent, stale-guarded route, so a same-day double-run is a safe no-op, not corruption.
    - cron: "0 */2 * * 1-5" # FX quote (390 Yahoo-direct pairs, auto-chains 162 derived-cross) — every 2h weekdays
    # Crypto: daily bounded history and marketcap slices (UTC); quote is manual only.
    - cron: "39 0 * * *"        # marketcap: daily 08:39 Taipei, max 250 markets
    - cron: "23 0 * * *"        # history: daily 08:23 Taipei, existing small batches
    # Global Index history: daily incremental, same 00:xx UTC slot family as the crypto jobs above
    # (00:26, between crypto-history and crypto-marketcap) — well after every major market's close
    # (US ~20:00-21:00 UTC is the latest of the 16 major indices) so Yahoo's daily candle is already
    # finalized by the time this fires. Market-level job over the existing 52-index registry, not
    # per-index; checkpoint/resume + per-index failure isolation already live in the route itself.
    - cron: "26 0 * * *"        # index history: daily 08:26 Taipei, existing checkpointed batches
    # Commodity Core Universe (18 fixed roots): one trigger per EXCHANGE-GROUP close, not per
    # symbol and not a single all-18 sweep (different commodity groups settle at very different
    # times of day, so one shared time either fires too early for some or unnecessarily late for
    # others). Same single logical owner (yahoo-commodity route + one engine) as before — grouping
    # only changes the schedule, not the pipeline. Each time is the LATEST possible UTC settlement
    # across that group's real exchange (i.e. winter/non-DST US offset, later in UTC than summer)
    # plus a 20-30min buffer, so a group never fires before its own settlement in either DST state.
    # Weekdays only; the route's own finalized-candle guard (reject high==low / zero-volume
    # placeholder bars) is the second line of defense against an in-progress session.
    - cron: "40 19 * * 1-5"     # Commodity: CBOT (Corn/Wheat/Soybeans/Soybean Oil) — day-session settle ~1:20pm CT = 19:20 UTC winter
    - cron: "0 20 * * 1-5"      # Commodity: COMEX/NYMEX (WTI, Nat Gas, Gold, Silver, Copper, Platinum, Palladium) — settle 1:30-2:30pm ET = 18:30-19:30 UTC winter
    - cron: "20 20 * * 1-5"     # Commodity: CME Livestock (Live Cattle, Lean Hogs) — Chicago settle ~1-2pm CT = 19:00-20:00 UTC winter
    - cron: "0 21 * * 1-5"      # Commodity: ICE (Coffee, Cocoa, Sugar, Cotton, Brent) — NY softs ~1-2pm ET + ICE Europe Brent, safe latest bound
    # Yahoo Taiwan "international index" page (22 fixed symbols): one trigger per MARKET close,
    # not per index. Each time is picked at/after that market's LATEST possible UTC close (i.e. its
    # winter/non-DST offset, which is later in UTC than its summer/DST offset) plus a 10-20min
    # buffer for Yahoo to finalize the daily bar — so a market never fires before its own close in
    # either DST state. Weekdays only (Mon-Fri UTC always lines up with the local trading weekday
    # for every zone below, since none of these trigger times cross UTC midnight relative to the
    # local session). Same idempotent/checkpointed route as the sweep above; Yahoo's own state
    # (no new candle -> NOOP) handles exchange holidays without a holiday calendar here.
    - cron: "20 6 * * 1-5"      # Index: Japan (^N225) — close 15:00 JST = 06:00 UTC
    - cron: "45 6 * * 1-5"      # Index: Korea (^KS11) — close 15:30 KST = 06:30 UTC
    - cron: "20 7 * * 1-5"      # Index: China A/B shares (SSE+SZSE, 6 symbols) — close 15:00 CST = 07:00 UTC
    - cron: "45 7 * * 1-5"      # Index: Philippines (PSEI.PS) — close 15:30 PHT = 07:30 UTC
    - cron: "25 8 * * 1-5"      # Index: Hong Kong (^HSI) — close 16:10 HKT = 08:10 UTC
    - cron: "15 9 * * 1-5"      # Index: SE Asia (^JKSE, ^KLSE, ^STI) — close 09:00 UTC (all three coincide)
    - cron: "15 10 * * 1-5"     # Index: India (^BSESN) — close 15:30 IST = 10:00 UTC
    - cron: "5 16 * * 1-5"      # Index: Russia (RTSI.ME) — nominal MOEX close ~15:50 UTC (source frozen since 2022, expect NOOP)
    - cron: "50 16 * * 1-5"     # Index: Europe (^GDAXI, ^FTSE, ^FCHI) — latest winter close 16:30-16:35 UTC
    - cron: "15 21 * * 1-5"     # Index: US (^DJI, ^GSPC, ^IXIC, ^SOX) — latest winter close 21:00 UTC
    # Macro/BIS: single daily source-level check (see the separate macro-bis-daily job below —
    # this is a different job shape, not the curl-only `ingest` job above, since it needs to run
    # the existing Node scripts directly rather than call an already-deployed Vercel route).
    # Official statistical releases have no fixed market-close time; once/day is sufficient and
    # each script's own source-state comparison NOOPs when nothing changed.
    - cron: "10 5 * * *"        # Macro/BIS daily source check, all days (safe NOOP on non-release days)
    # US 8:30am ET release window (NFP/CPI/PPI/GDP/PCE — BLS+BEA+Census core releases, verified via
    # economic_calendar_agencies + economic_calendar_us_core_series, both mapping_state=VERIFIED).
    # This is the one release-family group with a reliable, structural release TIME (all of these
    # agencies publish at the exact same 8:30am ET, mandated by OMB Statistical Policy Directive —
    # a fixed clock convention, not a per-event calendar guess); the actual event DATE still comes
    # from whichever weekday it lands on, which this does not need to know — checking on a non-
    # release day is a safe NOOP. 13:30 UTC is 8:30am EST (winter) and 9:30am EDT (summer) — i.e.
    # never BEFORE the actual release in either DST state, only up to 1h after in summer. Bounded
    # retry (T+0/10/20/40) by simply re-invoking the same idempotent, source-state-driven script —
    # no new retry-loop code; the daily safety sweep above remains the final catch-all for anything
    # still delayed past this window. Only FRED is filtered here (--providers=FRED) since that is
    # this codebase's existing adapter for these series — same script, same writer, same owner as
    # the daily sweep, not a second one.
    - cron: "30 13 * * 1-5"     # US release window: check 1 (T+0)
    - cron: "40 13 * * 1-5"     # US release window: check 2 (T+10)
    - cron: "50 13 * * 1-5"     # US release window: check 3 (T+20)
    - cron: "10 14 * * 1-5"     # US release window: check 4 (T+40, final bounded retry)
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options: [both, etf-price, moneydj-fund, moneydj-etf, global-etf-holdings, fund-holdings, fund-nav, consensus-ingest, consensus-aggregate, consensus-performance, consensus-flips, consensus-backfill, tw-fundamentals-refresh, global-pe-recompute, mops-financial-incremental, sec-financial-incremental, fx-quote, crypto-quote, crypto-marketcap, crypto-history, index-history, index-japan, index-korea, index-china, index-philippines, index-hongkong, index-sea, index-india, index-russia, index-europe, index-us, commodity-cbot, commodity-comex-nymex, commodity-livestock, commodity-ice, macro-bis-daily, macro-release-window-us, all]

concurrency:
  group: cloud-data-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://smartfund-v2.vercel.app
      SECRET: ${{ secrets.SMARTFUND_CRON_SECRET }}
    steps:
      - name: Guard — secret present
        run: |
          if [ -z "${SECRET}" ]; then
            echo "::error::SMARTFUND_CRON_SECRET is not set on this repository."
            exit 1
          fi

      - name: Select job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "39 0 * * *") echo "job=crypto-marketcap" >> "$GITHUB_OUTPUT" ;;
            "23 0 * * *") echo "job=crypto-history" >> "$GITHUB_OUTPUT" ;;
            "26 0 * * *") echo "job=index-history" >> "$GITHUB_OUTPUT" ;;
            "40 19 * * 1-5") echo "job=commodity-cbot" >> "$GITHUB_OUTPUT" ;;
            "0 20 * * 1-5") echo "job=commodity-comex-nymex" >> "$GITHUB_OUTPUT" ;;
            "20 20 * * 1-5") echo "job=commodity-livestock" >> "$GITHUB_OUTPUT" ;;
            "0 21 * * 1-5") echo "job=commodity-ice" >> "$GITHUB_OUTPUT" ;;
            "20 6 * * 1-5") echo "job=index-japan" >> "$GITHUB_OUTPUT" ;;
            "45 6 * * 1-5") echo "job=index-korea" >> "$GITHUB_OUTPUT" ;;
            "20 7 * * 1-5") echo "job=index-china" >> "$GITHUB_OUTPUT" ;;
            "45 7 * * 1-5") echo "job=index-philippines" >> "$GITHUB_OUTPUT" ;;
            "25 8 * * 1-5") echo "job=index-hongkong" >> "$GITHUB_OUTPUT" ;;
            "15 9 * * 1-5") echo "job=index-sea" >> "$GITHUB_OUTPUT" ;;
            "15 10 * * 1-5") echo "job=index-india" >> "$GITHUB_OUTPUT" ;;
            "5 16 * * 1-5") echo "job=index-russia" >> "$GITHUB_OUTPUT" ;;
            "50 16 * * 1-5") echo "job=index-europe" >> "$GITHUB_OUTPUT" ;;
            "15 21 * * 1-5") echo "job=index-us" >> "$GITHUB_OUTPUT" ;;
            "7 * * * *")  echo "job=fund-holdings" >> "$GITHUB_OUTPUT" ;;
            "17 * * * *") echo "job=etf-price" >> "$GITHUB_OUTPUT" ;;
            "27 * * * *") echo "job=fund-nav" >> "$GITHUB_OUTPUT" ;;
            "37 * * * *") echo "job=moneydj-fund" >> "$GITHUB_OUTPUT" ;;
            "47 * * * *") echo "job=moneydj-etf" >> "$GITHUB_OUTPUT" ;;
            "57 * * * *") echo "job=global-etf-holdings" >> "$GITHUB_OUTPUT" ;;
            "20 1,4,7,10,13,16,19,22 * * *") echo "job=consensus-ingest" >> "$GITHUB_OUTPUT" ;;
            "30 22 * * *") echo "job=consensus-aggregate" >> "$GITHUB_OUTPUT" ;;
            "0 0 * * *") echo "job=consensus-performance" >> "$GITHUB_OUTPUT" ;;
            "40 1,4,7,10,13,16,19,22 * * *") echo "job=consensus-flips" >> "$GITHUB_OUTPUT" ;;
            "50 23 * * *") echo "job=consensus-backfill" >> "$GITHUB_OUTPUT" ;;
            "30 8 * * 1-5") echo "job=tw-fundamentals-refresh" >> "$GITHUB_OUTPUT" ;;
            "0 */3 * * *") echo "job=global-pe-recompute" >> "$GITHUB_OUTPUT" ;;
            "30 10 * * 1-5") echo "job=mops-financial-incremental" >> "$GITHUB_OUTPUT" ;;
            "30 14 * * 1-5") echo "job=mops-financial-incremental" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * *") echo "job=sec-financial-incremental" >> "$GITHUB_OUTPUT" ;;
            "0 */2 * * 1-5") echo "job=fx-quote" >> "$GITHUB_OUTPUT" ;;
            *)            echo "job=${{ github.event.inputs.job || 'all' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fund holdings batch (MoneyDJ)
        if: ${{ contains(fromJSON('["fund-holdings","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-fund-holdings?provider=ALL" | tee fund-holdings-response.json
          echo

      - name: Fund NAV batch (SITCA)
        if: ${{ contains(fromJSON('["fund-nav","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-fund-nav?provider=ALL" | tee fund-nav-response.json
          echo

      - name: ETF price batch
        if: ${{ contains(fromJSON('["etf-price","both","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          # retry only transient network / 5xx; never hammer 403/429
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-etf-price" | tee etf-price-response.json
          echo

      - name: MoneyDJ fund batch
        if: ${{ contains(fromJSON('["moneydj-fund","both","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-moneydj-fund" | tee moneydj-fund-response.json
          echo

      - name: MoneyDJ ETF holdings batch
        if: ${{ contains(fromJSON('["moneydj-etf","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-moneydj-etf" | tee moneydj-etf-response.json
          echo

      - name: Global ETF holdings batch (BlackRock / iShares)
        if: ${{ contains(fromJSON('["global-etf-holdings","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-global-etf-holdings?provider=ALL" | tee global-etf-holdings-response.json
          echo

      - name: Consensus ingest (whitelisted sources -> events)
        if: ${{ contains(fromJSON('["consensus-ingest","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-ingest" | tee consensus-ingest-response.json
          echo

      - name: Consensus aggregate (1D / 7D / 30D rollup)
        if: ${{ contains(fromJSON('["consensus-aggregate","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-aggregate" | tee consensus-aggregate-response.json
          echo

      - name: Consensus performance (1M / 3M / 6M historical accuracy)
        if: ${{ contains(fromJSON('["consensus-performance","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-performance" | tee consensus-performance-response.json
          echo

      - name: Consensus flips (viewpoint-flip detection)
        if: ${{ contains(fromJSON('["consensus-flips","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-flips" | tee consensus-flips-response.json
          echo

      - name: Consensus backfill (bounded historical walk)
        if: ${{ contains(fromJSON('["consensus-backfill","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/consensus-backfill?days=180" | tee consensus-backfill-response.json
          echo

      - name: TW fundamentals refresh (BWIBBU PE, full market batch)
        if: ${{ contains(fromJSON('["tw-fundamentals-refresh","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 60 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-tw-fundamentals-refresh" | tee tw-fundamentals-refresh-response.json
          echo

      - name: Global PE recompute (DB-side, bounded batch)
        if: ${{ contains(fromJSON('["global-pe-recompute","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 60 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-global-pe-recompute" | tee global-pe-recompute-response.json
          echo

      - name: MOPS financial incremental (TWSE/TPEx, recent quarters only)
        if: ${{ contains(fromJSON('["mops-financial-incremental","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 110 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-mops-financial-incremental" | tee mops-financial-incremental-response.json
          echo

      - name: SEC EDGAR financial incremental (discovery + bounded issuer refresh)
        if: ${{ contains(fromJSON('["sec-financial-incremental","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 110 \
               --retry 2 --retry-connrefused --retry-delay 10 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/cloud-sec-financial-incremental" | tee sec-financial-incremental-response.json
          echo

      - name: FX quote (390 Yahoo-direct pairs, auto-chains 162 derived-cross)
        if: ${{ contains(fromJSON('["fx-quote","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          # Observed live to take up to ~250s for a full 390-pair sweep on Vercel — max-time is
          # comfortably above that and above the route's own maxDuration (280s), so curl never hangs
          # up on a still-running function. No retry: a partial run already checkpoints cleanly and
          # a retry would just re-hit the same in-progress dedup window.
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 320 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-fx?phase=quote" | tee fx-quote-response.json
          echo

      - name: Index history (52-index registry, incremental, checkpointed)
        if: ${{ contains(fromJSON('["index-history","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 300 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-index?phase=history" | tee index-history-response.json
          echo

      - name: Commodity — CBOT close (Corn, Wheat, Soybeans, Soybean Oil)
        if: ${{ contains(fromJSON('["commodity-cbot","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 200 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-commodity?phase=history&group=cbot&symbols=ZC=F,ZW=F,ZS=F,ZL=F" | tee commodity-cbot-response.json
          echo

      - name: Commodity — COMEX/NYMEX close (WTI, Nat Gas, Gold, Silver, Copper, Platinum, Palladium)
        if: ${{ contains(fromJSON('["commodity-comex-nymex","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 220 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-commodity?phase=history&group=comex-nymex&symbols=CL=F,NG=F,GC=F,SI=F,HG=F,PL=F,PA=F" | tee commodity-comex-nymex-response.json
          echo

      - name: Commodity — CME Livestock close (Live Cattle, Lean Hogs)
        if: ${{ contains(fromJSON('["commodity-livestock","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 150 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-commodity?phase=history&group=livestock&symbols=LE=F,HE=F" | tee commodity-livestock-response.json
          echo

      - name: Commodity — ICE close (Coffee, Cocoa, Sugar, Cotton, Brent)
        if: ${{ contains(fromJSON('["commodity-ice","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 200 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-commodity?phase=history&group=ice&symbols=KC=F,CC=F,SB=F,CT=F,BZ=F" | tee commodity-ice-response.json
          echo

      - name: Index — Japan market close (^N225)
        if: ${{ contains(fromJSON('["index-japan","all"]'), steps.pick.outputs.job) }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
               --connect-timeout 15 --max-time 120 \
               -H "Authorization: Bearer ${SECRET}" \
               "${BASE_URL}/api/cron/yahoo-index?phase=history&market=japan&symbols=%5EN225" | tee index-japan-response.json
          echo

      - name: Index — Korea market close (^KS11)
